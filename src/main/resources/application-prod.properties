# Perfil de producción — activo en el servidor con --spring.profiles.active=prod
# Sobreescribe solo los valores que difieren del application.properties base.

# LibreOffice en Linux (para generar el Anexo 9.2 desde .docx)
sit.soffice.path=/usr/bin/soffice

# Keystore PKI en ruta estable del servidor (se genera automáticamente si no existe)
sit.cert.keystore-path=/opt/sit/sit-keystore.p12

# Plantilla Anexo 9.2 — colocar el archivo en esta ruta antes de iniciar el servicio
sit.anexo92.plantilla-docx=/opt/sit/Anexo9.2.docx